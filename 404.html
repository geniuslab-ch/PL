<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 — Page Not Found | Panna League</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="160x160" href="/assets/logo-nav.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <style>
        .error-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: var(--spacing-2xl) var(--spacing-md);
            background: linear-gradient(135deg, #0a0a0a 0%, #0f1a0f 100%);
        }
        .error-content { max-width: 500px; }
        .error-code {
            font-family: var(--font-display);
            font-size: clamp(4rem, 15vw, 8rem);
            color: var(--color-accent);
            line-height: 1;
            margin-bottom: var(--spacing-md);
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
        }
        .error-logo {
            width: 90px;
            height: 90px;
            margin: 0 auto var(--spacing-lg);
            display: block;
        }
        .error-text {
            color: #d0d0d0;
            font-size: 1rem;
            margin-bottom: var(--spacing-sm);
        }
        .error-text.secondary {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: var(--spacing-xl);
        }
        .error-links {
            display: flex;
            gap: var(--spacing-md);
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <section class="error-page">
        <div class="error-content">
            <img src="/logo.png" alt="Panna League" class="error-logo">
            <div class="error-code">404</div>
            <p class="error-text">Cette page n'existe pas. / This page doesn't exist.</p>
            <p class="error-text secondary">Retourne à l'accueil ci-dessous. / Head back home below.</p>
            <div class="error-links">
                <a href="/" class="btn btn-primary">🇫🇷 ACCUEIL</a>
                <a href="/en/" class="btn btn-outline" style="border-color: var(--color-accent); color: var(--color-accent);">🇬🇧 HOME</a>
            </div>
        </div>
    </section>
</body>
</html>
